<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./img/JOVI-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <section class="section-login">

        <header class="header-hero">
            <h1>JOVI</h1>
            <nav>
                <ul class="menu-list">
                    <li><a href="./home.html" class="menu-list-item">Home</a></li>
                    <li><a href="./efeitos.html" class="menu-list-item">Efeitos</a></li>
                    <li><a href="./sobre-nos.html" class="menu-list-item">Sobre nós</a></li>
                </ul>
            </nav>
            <a class="login-botao" href="./login.html"><img src="./img/home/circle-user-regular-full.svg" alt="circle-user"></a>
        </header>

        <div class="card-login-container">
            <div class="card-login">
                <h2>Login</h2>
                <div class="inputs-login">
                    <div class="div-email">
                        <label for="IDemail">Email:</label>
                        <input type="email" id="IDemail" name="IDemail" placeholder=" Endereço de e-mail"/>
                    </div>
                    <div class="div-senha">
                        <label for="IDsenha">Senha:</label>
                        <input type="password" id="IDsenha" name="IDsenha" placeholder=" Mínimo de 5 caracteres"/>
                    </div>
                </div>
                <button id="btnLogar">Entrar</button>
                <p>Não possui uma conta? <a href="./criar.html">Cria conta</a></p>
                <div class="report-linha">
                    <p>Problemas de login?</p>
                    <button id="btnReportar">Reporte aqui</button>
                </div>
                
                <p>Email: jovinho@fiap.com.br<br>Senha: 123</p>
            </div>
        </div>

    </section>
    
        <footer></footer>

          <script src="./js/loginScript.js" sr></script>
</body>
</html>
